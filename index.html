<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstable SMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #1d222b;
    --panel: #2a313d;
    --line: #3d4757;
    --text: #f2efe8;
    --muted: #9aa3b2;
    --hazard: #ffc400;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    font-size: 1.05rem;
    line-height: 1.6;
  }
  a { color: var(--hazard); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--hazard);
    outline-offset: 2px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }

  /* header */
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1.5rem; padding-top: .9rem; padding-bottom: .9rem; }
  .brand { font-family: "Pixelify Sans", sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--text); text-decoration: none; }
  nav { display: flex; gap: 1.25rem; align-items: center; }
  nav a { color: var(--muted); text-decoration: none; padding: .25rem 0; border-bottom: 3px solid transparent; }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--text); border-bottom-color: var(--hazard); }
  nav a.discord { color: #1d222b; background: var(--hazard); padding: .3rem .8rem; border-bottom: 0; font-weight: 700; }

  .tape { height: 14px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, var(--ground) 14px 28px); }

  /* hero */
  .hero { padding: 3.5rem 0 1.5rem; }
  h1 {
    font-family: "Pixelify Sans", sans-serif; font-weight: 700;
    font-size: clamp(3rem, 12vw, 7rem); line-height: .95;
    margin: 0 0 1rem; letter-spacing: -.01em;
  }
  h1.glitch { animation: glitch 1.1s steps(1, end) 1; }
  @keyframes glitch {
    0%   { text-shadow: 6px 0 #ff3d71, -6px 0 #35e0ff; transform: translateX(-4px); }
    12%  { text-shadow: -8px 2px #ff3d71, 8px -2px #35e0ff; transform: translateX(5px) skewX(6deg); }
    24%  { text-shadow: none; transform: none; }
    40%  { text-shadow: 10px 0 #ff3d71, -10px 0 #35e0ff; transform: translateX(-6px); }
    52%  { text-shadow: none; transform: none; }
    70%  { text-shadow: -4px 0 #ff3d71, 4px 0 #35e0ff; transform: skewX(-4deg); }
    82%, 100% { text-shadow: none; transform: none; }
  }
  .lede { max-width: 38rem; color: var(--muted); font-size: 1.2rem; margin: 0 0 1.5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .btn { font: inherit; font-weight: 700; cursor: pointer; background: var(--hazard); color: #1d222b; border: 0; padding: .7rem 1.2rem; text-decoration: none; display: inline-block; }
  .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); }
  .btn.ghost:hover { border-color: var(--hazard); }
  .ip { font-family: "Pixelify Sans", sans-serif; font-size: 1.15rem; background: var(--panel); padding: .6rem 1rem; border-left: 4px solid var(--hazard); }

  h2 { font-family: "Pixelify Sans", sans-serif; font-size: 2rem; margin: 0 0 1rem; }
  h3 { font-family: "Pixelify Sans", sans-serif; font-size: 1.3rem; margin: 1.75rem 0 .5rem; }
  .block { padding: 2.25rem 0; }
  .intro { color: var(--muted); max-width: 40rem; margin: 0 0 1.5rem; }

  /* member cards */
  .members { display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 680px; }
  .card {
    position: relative; display: flex; align-items: center; gap: 1rem;
    min-height: 140px; padding: 1.1rem 1.5rem;
    color: #fff; text-decoration: none; overflow: hidden;
    border-radius: 22px;
    background-size: cover; background-position: center;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 70%, rgba(0,0,0,0) 100%);
  }
  .card:hover, .card:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  .card > * { position: relative; }
  .card .name { font-family: "Pixelify Sans", sans-serif; font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
  .card .role { font-size: .95rem; opacity: .85; }
  .pill {
    margin-left: auto; background: rgba(0,0,0,.45); padding: .35rem .8rem;
    border-radius: 999px; font-weight: 700; white-space: nowrap;
  }
  .pill::before { content: ""; display: inline-block; width: .55rem; height: .55rem; background: #ff4d4d; border-radius: 50%; margin-right: .45rem; }

  .avatar {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center; overflow: hidden;
    font-family: "Pixelify Sans", sans-serif; font-weight: 700; font-size: 1.8rem;
    background: #fff; color: #1d222b; border: 3px solid rgba(255,255,255,.85);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* profile */
  .back { display: inline-block; margin: 1.5rem 0 1rem; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--text); }
  .profile-head {
    position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem;
    padding: 2rem 1.5rem; border-radius: 18px; overflow: hidden; color: #fff;
    background-size: cover; background-position: center;
  }
  .profile-head::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,.1)); }
  .profile-head > * { position: relative; }
  .profile-head .avatar { width: 96px; height: 96px; font-size: 2.6rem; }
  .profile-head h2 { margin: 0; font-size: 2.4rem; }
  .profile-head .role { opacity: .9; }
  .links { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.25rem 0 0; }

  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 1.25rem; margin-top: 1rem; }
  .video { background: none; border: 0; padding: 0; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
  .video .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--panel); border-radius: 10px; overflow: hidden; }
  .video img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video .play {
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .video .play span {
    width: 52px; height: 36px; background: rgba(0,0,0,.7); border-radius: 10px; position: relative;
  }
  .video .play span::after {
    content: ""; position: absolute; left: 21px; top: 9px;
    border-left: 16px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  }
  .video:hover .thumb, .video:focus-visible .thumb { outline: 3px solid var(--hazard); }
  .video .vt { display: block; margin-top: .5rem; font-weight: 700; }
  .uploads { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 860px; background: #000; border-radius: 10px; overflow: hidden; }
  .uploads iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .empty { color: var(--muted); border: 2px dashed var(--line); padding: 1.25rem; max-width: 42rem; }

  dialog { width: min(920px, 94vw); padding: 0; border: 0; background: #000; border-radius: 10px; overflow: visible; }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  dialog .frame { position: relative; aspect-ratio: 16 / 9; }
  dialog iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 10px; }
  dialog .close { position: absolute; right: 0; top: -2.8rem; }

  /* channels list + wiki */
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rows li { display: grid; grid-template-columns: 9rem 1fr auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .rows .plat { color: var(--muted); }
  .rows .who { font-weight: 700; }
  @media (max-width: 640px) { .rows li { grid-template-columns: 1fr auto; } .rows .plat { grid-column: 1 / -1; margin-bottom: -.5rem; } }

  .wiki { display: grid; grid-template-columns: 15rem 1fr; gap: 2.5rem; align-items: start; }
  @media (max-width: 760px) { .wiki { grid-template-columns: 1fr; gap: 1.25rem; } }
  .wiki-side input { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 2px solid var(--line); padding: .6rem .75rem; margin-bottom: .75rem; }
  .wiki-side ul { list-style: none; margin: 0; padding: 0; }
  .wiki-side a { display: block; padding: .45rem .75rem; color: var(--muted); text-decoration: none; border-left: 4px solid var(--line); }
  .wiki-side a:hover { color: var(--text); }
  .wiki-side a.active { color: var(--text); border-left-color: var(--hazard); background: var(--panel); }
  .wiki-body { min-height: 20rem; }
  .wiki-body h2 { border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
  .wiki-body p, .wiki-body li { max-width: 42rem; }
  .wiki-body table { border-collapse: collapse; width: 100%; max-width: 42rem; }
  .wiki-body th, .wiki-body td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
  .wiki-body th { color: var(--muted); }
  .wiki-side .none { color: var(--muted); padding: .5rem .75rem; }

  .note { color: var(--muted); font-size: .95rem; max-width: 42rem; margin: .75rem 0; }
  .video .vd { display: block; color: var(--muted); font-size: .9rem; }

  footer { border-top: 1px solid var(--line); margin-top: 3rem; padding: 1.5rem 0 3rem; color: var(--muted); font-size: .95rem; }
  .view { display: none; }
  .view.on { display: block; }
  @media (prefers-reduced-motion: reduce) { h1.glitch { animation: none; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="#home" id="brand"></a>
    <nav aria-label="Main">
      <a href="#home" data-nav="home">Members</a>
      <a href="#wiki" data-nav="wiki">Wiki</a>
      <a href="#channels" data-nav="channels">Channels</a>
      <a class="discord" id="discord" href="#" target="_blank" rel="noopener">Discord</a>
    </nav>
  </div>
</header>
<div class="tape" aria-hidden="true"></div>

<main>
  <div class="view" id="view-home">
    <div class="wrap hero">
      <h1 id="title" class="glitch"></h1>
      <p class="lede" id="tagline"></p>
      <div class="actions">
        <a class="btn" href="#wiki">Read the wiki</a>
      </div>
    </div>
    <div class="wrap block">
      <h2>Members</h2>
      <p class="intro">Pick a member to see their channel and videos.</p>
      <div class="members" id="members"></div>
    </div>
  </div>

  <div class="view" id="view-member"><div class="wrap" id="member-body"></div></div>

  <div class="view" id="view-wiki">
    <div class="wrap block">
      <div class="wiki">
        <aside class="wiki-side" aria-label="Wiki pages">
          <input id="search" type="search" placeholder="Search the wiki" aria-label="Search the wiki">
          <ul id="wiki-list"></ul>
        </aside>
        <article class="wiki-body" id="wiki-body"></article>
      </div>
    </div>
  </div>

  <div class="view" id="view-channels">
    <div class="wrap block">
      <h2>Channels</h2>
      <p class="intro">Every link from every member, in one place.</p>
      <ul class="rows" id="all-channels"></ul>
    </div>
  </div>
</main>

<dialog id="player" aria-label="Video player">
  <button class="btn ghost close" id="player-close" type="button">Close</button>
  <div class="frame"><iframe id="player-frame" title="Video" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
</dialog>

<footer><div class="wrap" id="footer"></div></footer>

<script>
/* ==============================================================
   EDIT THIS SECTION. Everything on the site comes from here.
   ============================================================== */

const SITE = {
  name: "Unstable SMP",
  tagline: "A fan-made hub for the Unstable SMP. Pick a member to see their channel and videos.",
  discord: "",          // optional: paste a Discord invite link to show a Discord button
  youtubeApiKey:AIzaSyCvjFAtLtfcrf0avfqWnuLpVEQHj6zBu5w ""     // paste your free YouTube Data API key here for live subs and videos
};

/* One entry per member.
   channelId  the YouTube channel ID (already filled in for you)
   color      main card color, color2 is the second color of the gradient
   subs       backup sub count, only shown if live data can't load
   banner     OPTIONAL image to use instead of the channel's own banner
   avatar     OPTIONAL image to use instead of the channel's own picture
   links      any number of {label, url}
   videos     OPTIONAL pinned videos shown above the live list,
              written as "ID" or {id: "ID", title: "My title"}                */
const MEMBERS = [
  {
    slug: "wemmbu", name: "Wemmbu", role: "",
    channelId: "UCkzzNLnuM-VsATWC53ehwOQ",
    color: "#6a1fc2", color2: "#c04fd8", subs: "4.37M", banner: "", avatar: "",
    links: [{ label: "YouTube", url: "https://www.youtube.com/@wemmbumc" }],
    videos: []
  },
  {
    slug: "parrotx2", name: "ParrotX2", role: "",
    channelId: "UCPLMPHT-d8GZOqL_AHJFdQQ",
    color: "#1b7a3e", color2: "#8fd88a", subs: "4.04M", banner: "", avatar: "",
    links: [{ label: "YouTube", url: "https://www.youtube.com/@ParrotX2" }],
    videos: []
  },
  {
    slug: "flamefrags", name: "FlameFrags", role: "",
    channelId: "UCvYPobTo42NM36X7VC4dLhA",
    color: "#a3121f", color2: "#5b2a6e", subs: "2.81M", banner: "", avatar: "",
    links: [{ label: "YouTube", url: "https://www.youtube.com/@FlameFragsMC" }],
    videos: []
  },
  {
    slug: "spoke", name: "Spoke", role: "",
    channelId: "UCk2uxbWi5py_iJXaEsh2YRA",
    color: "#0b4d2e", color2: "#161616", subs: "", banner: "", avatar: "",
    links: [{ label: "YouTube", url: "https://www.youtube.com/@Spokeishere" }],
    videos: []
  }
];

/* Wiki pages: id (used in the link), title, and body (plain HTML). */
const WIKI = [
  { id: "about", title: "About this site", body: `
      <p>This is a fan-made hub for the Unstable SMP, a scripted Minecraft SMP. Pick a member on the Members page to see their channel and videos.</p>
      <p>To add more wiki pages, add an entry to the WIKI list at the top of the script in index.html.</p>` }
];

/* ==============================================================
   Site code. You shouldn't need to change anything below.
   ============================================================== */

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/* ---------- YouTube data (live) ---------- */
const API = "https://www.googleapis.com/youtube/v3";
const CACHE_MINUTES = 30;
const live = {};   // channelId -> { subs, avatar, banner }
const validId = (id) => /^UC[\w-]{22}$/.test(id || "");

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return Date.now() - o.t > CACHE_MINUTES * 60000 ? null : o.v;
  } catch (e) { return null; }
}
function cacheSet(key, v) {
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch (e) {}
}
async function yt(endpoint, params) {
  const q = new URLSearchParams(Object.assign({}, params, { key: SITE.youtubeApiKey }));
  const r = await fetch(API + "/" + endpoint + "?" + q);
  const data = await r.json();
  if (!r.ok) throw new Error((data.error && data.error.message) || "HTTP " + r.status);
  return data;
}

function fmtSubs(n) {
  const trim = (x) => x.toFixed(2).replace(/\.?0+$/, "");
  if (n >= 1e6) return trim(n / 1e6) + "M";
  if (n >= 1e3) return trim(n / 1e3) + "K";
  return String(n);
}

const liveOf = (m) => live[m.channelId] || {};
const avatarOf = (m) => m.avatar || liveOf(m).avatar || "";
const bannerOf = (m) => m.banner || liveOf(m).banner || "";
function subsText(m) {
  const l = liveOf(m);
  return typeof l.subs === "number" ? fmtSubs(l.subs) : (m.subs || "");
}

async function loadLive() {
  if (!SITE.youtubeApiKey) {
    console.info("No YouTube API key set: showing backup sub counts and the uploads player.");
    return;
  }
  const ids = MEMBERS.map((m) => m.channelId).filter(validId);
  const key = "usmp-channels:" + ids.join("");
  let stats = cacheGet(key);
  if (!stats) {
    try {
      const d = await yt("channels", { part: "snippet,statistics,brandingSettings", id: ids.join(","), maxResults: 50 });
      stats = {};
      (d.items || []).forEach((c) => {
        const banner = c.brandingSettings && c.brandingSettings.image && c.brandingSettings.image.bannerExternalUrl;
        const th = c.snippet && c.snippet.thumbnails;
        stats[c.id] = {
          subs: c.statistics.hiddenSubscriberCount ? null : Number(c.statistics.subscriberCount),
          avatar: th ? (th.medium || th.default).url : "",
          banner: banner ? banner + "=w1060" : ""
        };
      });
      cacheSet(key, stats);
    } catch (e) {
      console.warn("Could not load YouTube channel stats:", e.message);
      return;
    }
  }
  Object.assign(live, stats);
  renderMembers();
  route(true);
}

async function loadVideos(m) {
  const key = "usmp-videos:" + m.channelId;
  const cached = cacheGet(key);
  if (cached) return cached;
  const d = await yt("playlistItems", {
    part: "snippet,contentDetails",
    playlistId: "UU" + m.channelId.slice(2),
    maxResults: 24
  });
  const list = (d.items || []).map((i) => ({
    id: i.contentDetails.videoId,
    title: i.snippet.title,
    date: i.contentDetails.videoPublishedAt || i.snippet.publishedAt
  })).filter((v) => v.id && !/^(Private|Deleted) video$/i.test(v.title));
  cacheSet(key, list);
  return list;
}

/* ---------- Rendering ---------- */
function paint(node, m) {
  const b = bannerOf(m);
  node.style.backgroundImage = b
    ? `linear-gradient(110deg, ${m.color}e6 0%, ${m.color2}66 100%), url("${b}")`
    : `linear-gradient(120deg, ${m.color}, ${m.color2})`;
}

function makeAvatar(m) {
  const a = el("div", "avatar");
  const src = avatarOf(m);
  if (src) {
    const img = el("img");
    img.src = src;
    img.alt = "";
    a.appendChild(img);
  } else {
    a.textContent = m.name.charAt(0).toUpperCase();
  }
  return a;
}

function renderMembers() {
  const box = $("#members");
  box.innerHTML = "";
  MEMBERS.forEach((m) => {
    const a = el("a", "card");
    a.href = "#member/" + m.slug;
    paint(a, m);
    const info = el("div");
    info.append(el("div", "name", m.name), el("div", "role", m.role || ""));
    a.append(makeAvatar(m), info);
    const t = subsText(m);
    if (t) a.appendChild(el("span", "pill", t));
    box.appendChild(a);
  });
}

function renderChannels() {
  const ul = $("#all-channels");
  ul.innerHTML = "";
  MEMBERS.forEach((m) => (m.links || []).forEach((l) => {
    const li = el("li");
    const a = el("a", "", "Open channel");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    li.append(el("span", "plat", l.label), el("span", "who", m.name), a);
    ul.appendChild(li);
  }));
}

function openVideo(id) {
  $("#player-frame").src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?autoplay=1";
  $("#player").showModal();
}

function videoGrid(list) {
  const grid = el("div", "videos");
  list.forEach((v) => {
    const item = typeof v === "string" ? { id: v } : v;
    const b = el("button", "video");
    b.type = "button";
    const thumb = el("span", "thumb");
    thumb.style.display = "block";
    const img = el("img");
    img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(item.id) + "/hqdefault.jpg";
    img.alt = "";
    img.loading = "lazy";
    const play = el("span", "play");
    play.appendChild(el("span"));
    thumb.append(img, play);
    b.append(thumb, el("span", "vt", item.title || "Watch video"));
    if (item.date) {
      const d = new Date(item.date);
      if (!isNaN(d)) b.appendChild(el("span", "vd", d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" })));
    }
    b.addEventListener("click", () => openVideo(item.id));
    grid.appendChild(b);
  });
  return grid;
}

function uploadsPlayer(m) {
  const box = el("div", "uploads");
  const f = el("iframe");
  f.title = m.name + " uploads";
  f.src = "https://www.youtube-nocookie.com/embed/videoseries?list=UU" + m.channelId.slice(2);
  f.allow = "accelerometer; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  box.appendChild(f);
  return box;
}

async function fillVideos(m, holder) {
  const fallback = (msg) => {
    holder.innerHTML = "";
    if (msg) holder.appendChild(el("p", "note", msg));
    if (validId(m.channelId)) holder.appendChild(uploadsPlayer(m));
    else holder.appendChild(el("p", "empty", "No channel ID set for this member."));
  };
  if (!SITE.youtubeApiKey || !validId(m.channelId)) { fallback(); return; }
  holder.appendChild(el("p", "note", "Loading videos..."));
  try {
    const list = await loadVideos(m);
    if (!holder.isConnected) return;
    holder.innerHTML = "";
    holder.appendChild(list.length ? videoGrid(list) : el("p", "empty", "No public videos found for this channel."));
  } catch (e) {
    console.warn("Could not load videos:", e.message);
    if (holder.isConnected) fallback("Couldn't load the video list from YouTube, so this is the uploads player instead.");
  }
}

function renderMember(slug) {
  const m = MEMBERS.find((x) => x.slug === slug);
  const body = $("#member-body");
  body.innerHTML = "";
  if (!m) return false;

  const back = el("a", "back", "Back to members");
  back.href = "#home";
  body.appendChild(back);

  const l = liveOf(m);
  const subsLine = typeof l.subs === "number"
    ? l.subs.toLocaleString("en-US") + " subscribers"
    : (m.subs ? m.subs + " subscribers" : "");
  const head = el("div", "profile-head");
  paint(head, m);
  const who = el("div");
  who.append(el("h2", "", m.name), el("div", "role", [m.role, subsLine].filter(Boolean).join(" - ")));
  head.append(makeAvatar(m), who);
  body.appendChild(head);

  if (typeof l.subs === "number") {
    body.appendChild(el("p", "note", "Live from YouTube. YouTube rounds public subscriber counts to three significant figures, so this is as exact as it gets."));
  }

  if ((m.links || []).length) {
    const links = el("div", "links");
    m.links.forEach((lk) => {
      const a = el("a", "btn ghost", lk.label);
      a.href = lk.url; a.target = "_blank"; a.rel = "noopener";
      links.appendChild(a);
    });
    body.appendChild(links);
  }

  const sec = el("section", "block");
  if ((m.videos || []).length) {
    sec.appendChild(el("h2", "", "Featured"));
    sec.appendChild(videoGrid(m.videos));
  }
  const h = el("h2", "", "Videos");
  if ((m.videos || []).length) h.style.marginTop = "2rem";
  const holder = el("div");
  sec.append(h, holder);
  body.appendChild(sec);
  fillVideos(m, holder);

  document.title = m.name + " | " + SITE.name;
  return true;
}

function renderWikiList(filter) {
  const ul = $("#wiki-list");
  const q = (filter || "").trim().toLowerCase();
  const current = location.hash.split("/")[1] || WIKI[0].id;
  ul.innerHTML = "";
  const hits = WIKI.filter((p) => !q || p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q));
  if (!hits.length) { ul.appendChild(el("li", "none", "No pages match that search.")); return; }
  hits.forEach((p) => {
    const li = el("li");
    const a = el("a", p.id === current ? "active" : "", p.title);
    a.href = "#wiki/" + p.id;
    li.appendChild(a);
    ul.appendChild(li);
  });
}

function renderWikiPage(id) {
  const page = WIKI.find((p) => p.id === id) || WIKI[0];
  $("#wiki-body").innerHTML = "<h2></h2>" + page.body;
  $("#wiki-body h2").textContent = page.title;
  document.title = page.title + " | " + SITE.name;
}

function route(keepScroll) {
  const parts = location.hash.replace("#", "").split("/");
  let view = ["home", "member", "wiki", "channels"].includes(parts[0]) ? parts[0] : "home";
  if (view === "member" && !renderMember(parts[1])) view = "home";
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "view-" + view));
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === (view === "member" ? "home" : view)));
  if (view === "wiki") { renderWikiList($("#search").value); renderWikiPage(parts[1]); }
  if (view === "home" || view === "channels") document.title = SITE.name;
  if (keepScroll !== true) window.scrollTo(0, 0);
}

function init() {
  $("#brand").textContent = SITE.name;
  $("#title").textContent = SITE.name;
  $("#tagline").textContent = SITE.tagline;
  $("#discord").href = SITE.discord || "#";
  $("#discord").hidden = !SITE.discord;
  $("#footer").textContent = SITE.name + " is a fan-made site. It is not affiliated with Mojang, Microsoft or the creators shown.";
  renderMembers();
  renderChannels();

  const dlg = $("#player");
  $("#player-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("close", () => { $("#player-frame").src = "about:blank"; });
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

  $("#search").addEventListener("input", (e) => renderWikiList(e.target.value));
  window.addEventListener("hashchange", () => route());
  route();
  loadLive();
}
init();
</script>
</body>
</html>
